apiVersion: v1
kind: Pod
metadata:
  name: todoapp-b
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
    - name: todoapp
      image: vitalysemeniv/todoapp:3.0.0
      ports:
        - containerPort: 8000
      env:
        - name: DJANGO_SETTINGS_MODULE
          value: todolist.settings
        - name: DJANGO_SUPERUSER_USERNAME
          value: admin
        - name: DJANGO_SUPERUSER_PASSWORD
          value: admin123
        - name: DJANGO_SUPERUSER_EMAIL
          value: admin@example.com
