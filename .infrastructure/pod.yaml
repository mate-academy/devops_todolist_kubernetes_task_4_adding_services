apiVersion: v1
kind: Pod
metadata:
  name: todolist-pod-1
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
    - name: todolist
      image: aleksmajlo/todoapp:3.0.0
      ports:
        - containerPort: 8000
      env:
        - name: PYTHONUNBUFFERED
          value: "1"

        - name: DB_ENGINE
          value: "django.db.backends.sqlite3"

        - name: DB_NAME
          value: "/app/db.sqlite3"

        - name: LANGUAGE_CODE
          value: "en-us"

        - name: TIME_ZONE
          value: "UTC"

        - name: USE_I18N
          value: "true"

        - name: USE_L10N
          value: "true"

        - name: USE_TZ
          value: "true"

        - name: STATIC_URL
          value: "/static/"

        - name: LOGIN_URL
          value: "/auth/login/"

        - name: LOGOUT_URL
          value: "/auth/logout/"

        - name: DEBUG
          value: "true"

        - name: ALLOWED_HOSTS
          value: "*"

---

