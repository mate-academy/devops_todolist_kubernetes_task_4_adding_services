apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod-1
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: d4vp/todoapp:3.0.0
    ports:
    - containerPort: 8000
    env:
    - name: DEBUG
      value: "True"
    - name: ALLOWED_HOSTS
      value: "*"
    livenessProbe:
      httpGet:
        path: /api/liveness/
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /api/readiness/
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
---
