apiVersion: v1
kind: Pod
metadata:
  name: todoapp-1
  namespace: todoapp
  labels:        
    app: todolist
spec:
  containers:
  - name: todoapp
    image: olexandrkv/todoapp:3.0.0
    ports:
    - containerPort: 8000
    env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: ALLOWED_HOSTS
          value: "*"
    livenessProbe:
      httpGet:
        path: /
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
---
