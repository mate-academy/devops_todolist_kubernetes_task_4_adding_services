apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: skermas48/todoapp:3.1.0
    ports:
    - containerPort: 8080
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: DJANGO_SETTINGS_MODULE
      value: "todoapp.settings"
    - name: DB_ENGINE
      value: "django.db.backends.mysql"
    - name: DB_HOST
      value: "FVFFM3F5Q05N"
    - name: DB_PORT
      value: "3306"
    - name: DB_NAME
      value: "tododb"
    - name: DB_PASSWORD
      value: "my-secret-pw"
    - name: DB_USER
      value: "root"
    livenessProbe:
      httpGet:
        path: api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

