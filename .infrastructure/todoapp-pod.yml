apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    ports:
    - containerPort: 8080
    env:
      - name: DEBUG
        value: "1"
      - name: SECRET_KEY
        value: "django-insecure-k8s-todoapp-secret-key"
      - name: ALLOWED_HOSTS
        value: "*"
      - name: DATABASE_URL
        value: "sqlite:////app/db.sqlite3"
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

