apiVersion: v1
kind: Pod
metadata:
  name: todoapp-1
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    ports:
    - containerPort: 8080
    env:
    - name: SECRET_KEY
      value: "SECRET_KEY"
    - name: DB_NAME
      value: "DB_NAME"
    - name: DB_PASSWORD
      value: "DB_PASSWORD"
    - name: DATABASE_URL
      value: "DATABASE_URL"
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
---
