apiVersion: v1
kind: Service
metadata:
 name: todo-nodeport-service
 namespace: todoapp
spec:
 type: NodePort
 selector:
   app: todolist
 ports:
   - protocol: TCP
     port: 8000 # Порт сервісу всередині кластера
     targetPort: 8000 # Порт додатка в Pod
     nodePort: 30008 # ПОРТ, який відкриється на машині-хості
