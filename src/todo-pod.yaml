apiVersion: v1
kind: Pod
metadata:
  name: todo-app-1
  labels:
    app: todolist
spec:
  containers:
    - name: todo-container
      image: maximprysyazhnikov/django-todo-app:latest
      ports:
        - containerPort: 8000
      env:
        - name: DJANGO_SETTINGS_MODULE
          value: "todolist.settings"
