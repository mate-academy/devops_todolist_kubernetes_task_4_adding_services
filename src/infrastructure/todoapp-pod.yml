apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels: todolist
spec:
  containers:
    - name: todoapp
      image: klemjl/todoapp:3.0.0
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /api/readyz/
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /api/healthz/
          port: 8000
        initialDelaySeconds: 15
        periodSeconds: 20

