apiVersion: v1
kind: Pod
metadata:
  name: todolist-pod-1
  labels:
    app: todolist
spec:
  containers:
    - name: todolist
      image: python:3.8-slim
      command: ["python", "-m", "http.server", "8000"]
      ports:
        - containerPort: 8000
      env:
        - name: DEBUG
          value: "True"
        - name: SECRET_KEY
          value: "some-secret-value"
---
apiVersion: v1
kind: Pod
metadata:
  name: todolist-pod-2
  labels:
    app: todolist
spec:
  containers:
    - name: todolist
      image: python:3.8-slim
      command: ["python", "-m", "http.server", "8000"]
      ports:
        - containerPort: 8000
      env:
        - name: DEBUG
          value: "True"
        - name: SECRET_KEY
          value: "some-secret-value"
---
apiVersion: v1
kind: Service
metadata:
  name: todolist-clusterip
spec:
  type: ClusterIP
  selector:
    app: todolist
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: todolist-nodeport
spec:
  type: NodePort
  selector:
    app: todolist
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
