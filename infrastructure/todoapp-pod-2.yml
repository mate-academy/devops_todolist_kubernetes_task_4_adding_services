apiVersion: v1
kind: Pod
metadata:
  name: todoappmodify
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: DJANGO_SETTINGS_MODULE
        value: "todolist.settings"
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
